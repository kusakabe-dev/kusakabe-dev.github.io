<!DOCTYPE html>
<html>
  <head>
    <meta charset='utf-8'>
    <title>{{ page.title }} - @kusakabe-dev</title>
    <style>
      @media print {
        /* 印刷時に不要な要素を非表示 */
        header, footer, .site-header, nav { display: none !important; }
    
        /* リスト全体と、個別のリスト項目（li）の両方で分割を禁止する */
        ul, ol {
          break-inside: auto; /* 全体は許可するが、項目単位で制御する */
        }

        li {
          break-inside: avoid; /* リストの1項目がページをまたぐのを防ぐ */
          margin-bottom: 0.5em; /* 項目間の微調整 */
        }

        /* セクションのタイトル（h2, h3）の直後での改ページを厳格に禁止 */
        h2, h3 {
          break-after: avoid-page !important;
          page-break-after: avoid !important;
        }

        /* 職歴の各ブロック（もしクラスを付けていれば）を塊として扱う */
        /* 現状のHTML構造に合わせて、特定の<div>や<section>があれば指定 */
        section, .job-item {
          break-inside: avoid;
        }

        /* 余白の最適化 */
        @page { margin: 15mm; }
      }
    </style>
  </head>

  <body>
    {{ content }}
  </body>
</html>
